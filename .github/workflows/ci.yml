name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: python3 -m unittest discover -s app/tests -p '*_test.py'
      - run: node app/tests/ui_logic_test.cjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned browser test dependencies
        run: python3 -m pip install -r app/tests/browser-requirements.txt
      - name: Install official Playwright Chromium
        run: python3 -m playwright install --with-deps chromium
      - name: Check desktop and mobile UI flows
        env:
          RELAY_UI_SCREENSHOTS: .relay/ui-smoke
        run: python3 app/tests/ui_smoke.py
      - name: Preserve fake-data UI screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: relay-ui-smoke
          path: .relay/ui-smoke/*.png
          if-no-files-found: ignore
          retention-days: 3
