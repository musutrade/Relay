[package]
name = "relay"
version = "0.1.0"
edition = "2024"
description = "A small durable task core with explicit executor ownership"
publish = false

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[workspace]
members = ["app"]
default-members = [".", "app"]
resolver = "3"
