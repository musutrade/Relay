[package]
name = "relay-app"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
relay = { path = ".." }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2"
libc = "0.2"
argon2 = "0.5"
# Already used transitively by Argon2; direct import binds new admission scopes.
blake2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
rpassword = "7"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
